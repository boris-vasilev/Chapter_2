# Snakemake profile for CSD3 (Slurm + Apptainer).
#
# Usage from the perturb_ldsc_pipeline directory:
#   snakemake --profile slurm                       # foreground driver
#   nohup snakemake --profile slurm >snake.log 2>&1 &   # detach on login node
#
# Requires: snakemake-executor-plugin-slurm and the `apptainer` binary
# on PATH (load the module in your shell init / job env if needed).

executor: slurm
jobs: 20               # max concurrent slurm jobs the driver will submit
restart-times: 1
keep-going: true
rerun-incomplete: true
latency-wait: 60

# CSD3 slurmctld is sensitive to automated client traffic. Site admin
# guidance (Stuart, 2026): wait >= 2 min between automated squeue calls;
# "each job scheduling cycle takes multiple minutes" so faster polling
# is pointless and risks a denial-of-service to the controller.
#
# With jobs=20 and a 180s poll interval, peak driver RPC rate is
# ~20/180 + 0.2 = ~0.3 calls/sec — well within polite limits.
max-jobs-per-second: 1            # int only; effective rate is jobs/poll-interval anyway
max-status-checks-per-second: 0.5
seconds-between-status-checks: 180

software-deployment-method: apptainer
# Bind both the symlinked /home path and the resolved /rds path so
# absolute paths from Path.resolve() inside the Snakefile work.
apptainer-args: "--fakeroot \
    -B /rds/project/rds-csoP2nj6Y6Y:/rds/project/rds-csoP2nj6Y6Y \
    -B /home/biv22/rds/rds-mrc-bsu-csoP2nj6Y6Y:/home/biv22/rds/rds-mrc-bsu-csoP2nj6Y6Y"

# Cluster defaults — override per rule with set-resources below.
default-resources:
  slurm_account:   "MRC-BSU2-SL2-CPU"
  slurm_partition: "icelake"
  cpus_per_task:   1
  mem_mb:          4000
  runtime:         30   # minutes

# Per-rule overrides. calculate_ld_scores parallelises 22 chrom
# Popen children — give it a node with enough cores.
set-resources:
  extract_de_results:
    runtime: 60
    mem_mb:  16000
    cpus_per_task: 4
  make_gene_sets:
    runtime: 30
    mem_mb:  8000
  munge_sumstats:
    runtime: 30
    mem_mb:  8000
  make_annot:
    runtime: 30
    mem_mb:  8000
    cpus_per_task: 8
  combine_annots:
    runtime: 15
    mem_mb:  4000
  calculate_ld_scores:
    runtime: 60
    mem_mb:  16000
    cpus_per_task: 8
  calculate_ld_scores_filtered:
    runtime: 60
    mem_mb:  16000
    cpus_per_task: 8
  filter_annot_files:
    runtime: 30
    mem_mb:  8000
  calculate_heritability:
    runtime: 30
    mem_mb:  8000
  # --- programs module (cell-type-specific S-LDSC) ---
  # program_make_annot / program_ld_scores fan out 22 chrom Popen children.
  program_make_annot:
    runtime: 30
    mem_mb:  8000
    cpus_per_task: 8
  program_ld_scores:
    runtime: 60
    mem_mb:  16000
    cpus_per_task: 8
  program_heritability:
    runtime: 30
    mem_mb:  8000
  collect_program_results:
    runtime: 20
    mem_mb:  8000
