# Matched-null S-LDSC permutation, v2 (corrected matching). See
# NOTES_null_v2.md for the fixes relative to the pilot (perturb_ldsc_permutation/).

# Inputs — shared with the main pipeline (paths relative to repo root).
de_results:    "data/DE_results_strong.csv"   # strong-perturbation filtered
coloc_dat:     "data/coloc_dat.tsv"
study_info:    "data/GWAS_study_info.csv"
# Per-condition screen baseMean for every measured gene; built once, outside
# the container, by `uv run python scripts/build_screen_expression.py`.
expression:    "data/permutations/inputs/screen_expression.tsv"
# The coloc_thr0.5 gene sets; `real` sets must be identical to these.
reference_gene_sets: "data/sensitivity/thr0.5/gene_sets"
protein_coding_coord:
  GRCh37: "data/gene_coord_protein_coding.txt"
  GRCh38: "data/gene_coord_protein_coding_hg38.txt"

cell_type:     "CD4"
h4_threshold:  0.8
min_anchors_per_regulator:    1
min_perturbations_per_target: 1
# Edge filter for gene sets AND for in/out-degree matching.
min_abs_logfc: 0.5

# Study -> conditions to run (Stage 2: the pilot combinations).
runs:
  AITD_Saevarsdottir_32581359_1: [Rest, Stim8hr, Stim48hr]
  ASTCO_Ferreira_30929738_1:     [Rest, Stim48hr]

# Matching: out- and in-degree = zero bin + n_degree_bins quantile bins among
# non-zero pool genes; expression = n_expr_bins quantile bins.
n_degree_bins: 4
n_expr_bins:   5
# Anchors with out-degree > 0: sample from the knn_k pool genes nearest in
# out-degree (within the anchor's in-degree x expression cell, widened if needed).
knn_k:         20
seed:          42        # same base seed as the pilot

# Null permutations per study x condition (perm indices 1..n_perm).
n_perm: 200

# All outputs: data/permutations/heritability/{study}/perm{P}/...
out_root: "data/permutations/heritability"

# One slurm job runs a whole perm x condition chain (gene sets -> make_annot
# x3 -> combine -> LD scores -> h2 -> delete annotations/LD scores), with
# chromosomes parallelised inside it.
chrom_parallel: 8
chain_mem_mb:   16000
chain_runtime:  90       # minutes
